<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">From leads to sales opportunities</title><desc id="desc">An editorial diagram showing a broad stream of leads narrowing into a smaller set of qualified opportunities.</desc><rect width="1200" height="630" fill="#111015"/><path d="M0 470C180 400 280 510 450 445S760 355 1200 455V630H0Z" fill="#2C1834"/><g fill="#F4F0E9" font-family="Arial,sans-serif"><text x="70" y="90" font-size="24" letter-spacing="5">MARKETING BEYOND MARKETING / INSIGHT</text><text x="70" y="185" font-size="64" font-weight="bold">Leads are not</text><text x="70" y="260" font-size="64" font-weight="bold">sales opportunities.</text><text x="70" y="318" font-size="24">Find the constraint before increasing your budget.</text></g><g transform="translate(760 90)" stroke-width="4"><path d="M20 28H360L238 245V405H142V245Z" fill="#2C1834" stroke="#F4F0E9"/><g fill="#BDB5BD"><circle cx="75" cy="89" r="14"/><circle cx="130" cy="88" r="14"/><circle cx="185" cy="89" r="14"/><circle cx="240" cy="89" r="14"/><circle cx="295" cy="89" r="14"/><circle cx="103" cy="145" r="14"/><circle cx="165" cy="145" r="14"/><circle cx="226" cy="145" r="14"/><circle cx="281" cy="145" r="14"/></g><g fill="#D6FF45"><circle cx="170" cy="225" r="14"/><circle cx="205" cy="270" r="14"/><circle cx="185" cy="337" r="14"/><circle cx="185" cy="440" r="20"/></g><text x="188" y="492" fill="#F4F0E9" font-size="23" text-anchor="middle" font-family="Arial,sans-serif">Qualified pipeline</text></g><circle cx="70" cy="550" r="10" fill="#D6FF45"/><text x="93" y="558" fill="#F4F0E9" font-size="22" font-family="Arial,sans-serif">MBM.</text></svg>