<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="4200" height="700" viewBox="0 0 4200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100b16"/>
      <stop offset="0.58" stop-color="#211128"/>
      <stop offset="1" stop-color="#401842"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#100b16" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#100b16" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#100b16" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="4200" height="700" fill="url(#bg)"/>
  <!-- Keep all artwork within LinkedIn's conservative safe display zone. -->
  <circle cx="3220" cy="330" r="350" fill="#d0f35a" opacity="0.13" filter="url(#blur)"/>
  <circle cx="3370" cy="655" r="340" fill="#7d2b7b" opacity="0.46"/>
  <image xlink:href="../assets/mbm-hero-editorial-v2.png" x="2860" y="20" width="720" height="660" preserveAspectRatio="xMidYMid meet" opacity="0.94"/>
  <rect width="4200" height="700" fill="url(#fade)"/>
  <text x="390" y="182" fill="#d0f35a" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="47" letter-spacing="12">MBM</text>
  <line x1="550" y1="164" x2="874" y2="164" stroke="#eee7dc" stroke-opacity="0.46" stroke-width="3"/>
  <text x="390" y="272" fill="#eee7dc" font-family="Arial, Helvetica, sans-serif" font-size="37" letter-spacing="8">MARKETING BEYOND MARKETING</text>
  <text x="390" y="421" fill="#eee7dc" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" letter-spacing="-3">Brands people choose.</text>
  <text x="390" y="540" fill="#d0f35a" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" letter-spacing="-3">Growth you can measure.</text>
  <text x="394" y="625" fill="#eee7dc" fill-opacity="0.72" font-family="Arial, Helvetica, sans-serif" font-size="27" letter-spacing="4">INDEPENDENT GROWTH &amp; CREATIVE AGENCY</text>
</svg>
