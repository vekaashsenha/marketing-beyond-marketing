<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="4200" height="700" viewBox="0 0 4200 700">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100916"/>
      <stop offset="0.55" stop-color="#211029"/>
      <stop offset="1" stop-color="#4a1647"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d0f35a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#d0f35a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="photoFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#211029" stop-opacity="1"/>
      <stop offset=".25" stop-color="#211029" stop-opacity=".55"/>
      <stop offset=".57" stop-color="#211029" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="photoClip"><rect x="2735" y="0" width="1465" height="700"/></clipPath>
  </defs>
  <rect width="4200" height="700" fill="url(#background)"/>
  <circle cx="3420" cy="310" r="660" fill="url(#halo)"/>
  <circle cx="3440" cy="350" r="430" fill="none" stroke="#d0f35a" stroke-opacity=".33" stroke-width="4"/>
  <circle cx="3440" cy="350" r="540" fill="none" stroke="#eee7dc" stroke-opacity=".13" stroke-width="2"/>
  <g clip-path="url(#photoClip)">
    <image xlink:href="../assets/mbm-hero-editorial-v2.png" x="2680" y="-190" width="1600" height="1090" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="2500" width="1700" height="700" fill="url(#photoFade)"/>
  <!-- Clear left 1000px for LinkedIn's overlapping company logo. -->
  <text x="1120" y="257" fill="#d0f35a" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="40" letter-spacing="10">MARKETING BEYOND MARKETING</text>
  <text x="1112" y="403" fill="#f4eee6" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="102" letter-spacing="-3">Make your move matter.</text>
  <line x1="1120" y1="466" x2="1460" y2="466" stroke="#d0f35a" stroke-width="6"/>
  <text x="1120" y="540" fill="#f4eee6" fill-opacity=".78" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="4">BRAND · DEMAND · DIGITAL EXPERIENCE</text>
</svg>
